services:
  # FastAPI Backend Web Service
  - type: web
    name: inventory-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
    plan: free

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: postgres
    plan: free
